[package]
name = "lowdash"
version = "0.8.0"
authors = ["Tirtadwipa Manunggal <tirtadwipa.manunggal@gmail.com>"]
description = "A highly optimized utility library inspired by Lodash for Rust with zero dependencies"
repository = "https://github.com/liberocks/lowdash"
readme = "README.md"
license = "MIT"
categories = ["rust-patterns"]
keywords = ["rust-lodash", "lodash", "utility"]
edition = "2021"
rust-version = "1.63"
autobenches = false

[dev-dependencies]
criterion = { version = "=0.4.0", default-features = false, features = ["cargo_bench_support", "html_reports", "plotters"] }
# Keep the benchmark-only dependency graph buildable on the declared MSRV.
serde = "=1.0.147"
serde_derive = "=1.0.147"
serde_json = "=1.0.85"
ryu = "=1.0.11"
libc = "=0.2.137"
proc-macro2 = "=1.0.103"
quote = "=1.0.21"
unicode-ident = "=1.0.3"
regex = "=1.6.0"
itoa = "=1.0.3"
half = "=2.1.0"
clap = "=3.1.18"
textwrap = "=0.15.2"
smawk = "=0.3.1"
unicode-width = "=0.1.10"

[[bench]]
name = "benchmark"
harness = false
