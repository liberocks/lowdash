name: Benchmark
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
permissions:
  actions: read
  contents: read

jobs:
  compiler-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.63.0
      - uses: Swatinem/rust-cache@v2
      - name: benchmark on Rust 1.63
        run: cargo +1.63.0 bench --bench benchmark -- 'snake_case|kebab_case|substring' --noplot --save-baseline rust-1.63
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: benchmark on stable Rust
        run: cargo +stable bench --bench benchmark -- 'snake_case|kebab_case|substring' --noplot --baseline rust-1.63 | tee compiler-comparison.txt
      - uses: actions/upload-artifact@v7
        with:
          name: compiler-comparison
          path: compiler-comparison.txt
          retention-days: 90

  benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version:
          - stable
          - nightly
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.version }}
      - name: cache
        uses: Swatinem/rust-cache@v2

      - name: find previous baseline
        id: find-baseline
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: criterion-baseline-${{ matrix.version }}
        run: |
          find_run_with_baseline() {
            local branch="${1:-}"
            local branch_args=()
            if [[ -n "$branch" ]]; then
              branch_args+=(--branch "$branch")
            fi

            while read -r candidate; do
              [[ "$candidate" == "$GITHUB_RUN_ID" ]] && continue
              artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts" \
                --paginate \
                --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\" and .expired == false) | .id")"
              if [[ -n "$artifact_id" ]]; then
                printf '%s\n' "$candidate"
                return
              fi
            done < <(gh run list --workflow Benchmark "${branch_args[@]}" --status success --limit 50 --json databaseId --jq '.[].databaseId')
          }

          run_id="$(find_run_with_baseline "$GITHUB_REF_NAME")"
          if [[ -z "$run_id" ]]; then
            run_id="$(find_run_with_baseline)"
          fi
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: download previous baseline
        id: download-baseline
        if: steps.find-baseline.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: criterion-baseline-${{ matrix.version }}
          path: previous-report/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.find-baseline.outputs.run-id }}

      - name: run benchmark
        run: |
          set -o pipefail
          cargo bench --bench benchmark --no-run --message-format=json-render-diagnostics > cargo-build.json
          benchmark_binary="$(python3 - <<'PYEOF'
          import json

          paths = []
          with open("cargo-build.json") as f:
              for line in f:
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  target = event.get("target", {})
                  if (
                      event.get("reason") == "compiler-artifact"
                      and target.get("name") == "benchmark"
                      and "bench" in target.get("kind", [])
                      and event.get("executable")
                  ):
                      paths.append(event["executable"])

          if not paths:
              raise SystemExit("Unable to locate the benchmark executable")
          print(paths[-1])
          PYEOF
          )"
          /usr/bin/time -v -o process_memory.txt "$benchmark_binary" --bench --save-baseline baseline 2>&1 | tee bench_output.txt
      - name: tabularize results
        env:
          VERSION: ${{ matrix.version }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import re
          from pathlib import Path

          with open("bench_output.txt") as f:
              content = f.read()

          def load_estimates(root):
              root = Path(root)
              estimates = {}
              if not root.is_dir():
                  return estimates

              for benchmark_file in root.rglob("baseline/benchmark.json"):
                  benchmark_dir = benchmark_file.parent
                  try:
                      benchmark = json.loads(benchmark_file.read_text())
                      estimate = json.loads((benchmark_dir / "estimates.json").read_text())
                      mean = estimate["mean"]["point_estimate"]
                  except (OSError, KeyError, TypeError, ValueError):
                      continue

                  for name in (benchmark.get("full_id"), benchmark.get("title")):
                      if name:
                          estimates[name] = mean
              return estimates

          current_estimates = load_estimates("report")
          previous_estimates = load_estimates("previous-report")

          entries = []
          current_name = None
          current_time_min = current_time_mean = current_time_max = None
          skip_prefixes = ("Found", "Warning", "Benchmarking", "Gnuplot", "criterion", "Generating", "Baseline")

          def flush_entry():
              if current_name is not None and current_time_min is not None:
                  current = current_estimates.get(current_name)
                  previous = previous_estimates.get(current_name)
                  change = None
                  if current is not None and previous not in (None, 0):
                      change = (current / previous - 1) * 100
                  entries.append((current_name, current_time_min, current_time_mean, current_time_max, change))

          for line in content.split("\n"):
              stripped = line.strip()
              if not stripped:
                  continue
              if stripped.startswith("Benchmarking ") and ": " not in stripped:
                  flush_entry()
                  current_name = stripped.removeprefix("Benchmarking ")
                  current_time_min = current_time_mean = current_time_max = None
              elif "time:" in stripped and "[" in stripped and current_name:
                  m = re.search(r"\[([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\]", stripped)
                  if m:
                      current_time_min, current_time_mean, current_time_max = m.group(1), m.group(2), m.group(3)
              elif not line.startswith((" ", "\t")) and re.match(r"^[a-zA-Z_]", stripped) and not any(stripped.startswith(p) for p in skip_prefixes):
                  flush_entry()
                  current_name = stripped
                  current_time_min = current_time_mean = current_time_max = None

          flush_entry()

          def verdict(change):
              if change is None:
                  return "\u2014"
              if change < -0.5:
                  return "improvement"
              elif change > 0.5:
                  return "regression"
              else:
                  return "~ no change"

          peak_rss_kib = None
          try:
              for line in Path("process_memory.txt").read_text().splitlines():
                  match = re.search(r"Maximum resident set size \(kbytes\):\s*(\d+)", line)
                  if match:
                      peak_rss_kib = int(match.group(1))
                      break
          except OSError:
              pass

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a") as f:
              version = os.environ.get("VERSION")
              f.write(f"## Benchmark Results ({version})\n\n")
              if peak_rss_kib is not None:
                  f.write(f"Peak process RSS: {peak_rss_kib / 1024:.1f} MiB ({peak_rss_kib} KiB)\n\n")
              if previous_estimates:
                  f.write("Comparison: previous successful benchmark baseline\n\n")
              else:
                  f.write("Comparison: unavailable (no previous benchmark baseline)\n\n")
              f.write("| Benchmark | Min | Mean | Max | Mean Delta | Verdict |\n")
              f.write("|---|---|---|---|---|---|\n")
              for name, mn, mean, mx, change in entries:
                  delta = "\u2014" if change is None else f"{change:+.2f}%"
                  f.write(f"| {name} | {mn} | {mean} | {mx} | {delta} | {verdict(change)} |\n")
          PYEOF
      - uses: actions/upload-artifact@v7
        with:
          name: report ${{ matrix.version }}
          path: |
            bench_output.txt
            process_memory.txt
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: criterion-baseline-${{ matrix.version }}
          path: report/
          retention-days: 90
