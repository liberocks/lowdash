name: Benchmark
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version:
          - stable
          - nightly
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.version }}
      - name: cache
        uses: Swatinem/rust-cache@v2

      - name: find previous baseline
        id: find-baseline
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: criterion-baseline-${{ matrix.version }}
        run: |
          run_id=""
          while read -r candidate; do
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts" \
              --paginate \
              --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\" and .expired == false) | .id")"
            if [[ -n "$artifact_id" ]]; then
              run_id="$candidate"
              break
            fi
          done < <(gh run list --workflow Benchmark --branch "$GITHUB_REF_NAME" --status success --limit 20 --json databaseId --jq '.[].databaseId')
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: download previous baseline
        id: download-baseline
        if: steps.find-baseline.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: criterion-baseline-${{ matrix.version }}
          path: report/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.find-baseline.outputs.run-id }}

      - name: run benchmark with comparison
        if: steps.download-baseline.outcome == 'success'
        run: (set -o pipefail; cargo bench --bench benchmark -- --baseline baseline --save-baseline baseline 2>&1 | tee bench_output.txt)

      - name: run benchmark (initial)
        if: steps.download-baseline.outcome != 'success'
        run: (set -o pipefail; cargo bench --bench benchmark -- --save-baseline baseline 2>&1 | tee bench_output.txt)
      - name: tabularize results
        env:
          VERSION: ${{ matrix.version }}
        run: |
          python3 << 'PYEOF'
          import os, re

          with open("bench_output.txt") as f:
              content = f.read()

          entries = []
          current_name = None
          current_time_min = current_time_mean = current_time_max = None
          current_chg_min = current_chg_mean = current_chg_max = None
          skip_prefixes = ("Found", "Warning", "Benchmarking", "Gnuplot", "criterion", "Generating", "Baseline")

          def flush_entry():
              if current_name is not None and current_time_min:
                  entries.append((current_name, current_time_min, current_time_mean, current_time_max,
                                  current_chg_min, current_chg_mean, current_chg_max))

          for line in content.split("\n"):
              stripped = line.strip()
              if not stripped:
                  continue
              if not line.startswith((" ", "\t")) and re.match(r"^[a-zA-Z_]", stripped) and not any(stripped.startswith(p) for p in skip_prefixes):
                  flush_entry()
                  current_name = stripped
                  current_time_min = current_time_mean = current_time_max = None
                  current_chg_min = current_chg_mean = current_chg_max = None
              elif stripped.startswith("time:") and "[" in stripped and current_name:
                  m = re.search(r"\[([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\s+([\d.]+\s+\S+)\]", stripped)
                  if m:
                      current_time_min, current_time_mean, current_time_max = m.group(1), m.group(2), m.group(3)
              elif stripped.startswith("change:") and "[" in stripped and current_name:
                  m = re.search(r"\[([+-][\d.]+%)\s+([+-][\d.]+%)\s+([+-][\d.]+%)\]", stripped)
                  if m:
                      current_chg_min, current_chg_mean, current_chg_max = m.group(1), m.group(2), m.group(3)

          flush_entry()

          def verdict(mean_chg):
              if mean_chg is None:
                  return "\u2014"
              v = float(mean_chg.rstrip("%"))
              if v < -0.5:
                  return "improvement"
              elif v > 0.5:
                  return "regression"
              else:
                  return "~ no change"

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a") as f:
              version = os.environ.get("VERSION")
              f.write(f"## Benchmark Results ({version})\n\n")
              f.write("| Benchmark | Min | Mean | Max | Delta | Verdict |\n")
              f.write("|---|---|---|---|---|---|\n")
              for name, mn, mean, mx, chg_min, chg_mean, chg_max in entries:
                  if chg_mean:
                      delta = f"{chg_min} / {chg_mean} / {chg_max}"
                  else:
                      delta = "\u2014"
                  f.write(f"| {name} | {mn} | {mean} | {mx} | {delta} | {verdict(chg_mean)} |\n")
          PYEOF
      - uses: actions/upload-artifact@v7
        with:
          name: report ${{ matrix.version }}
          path: bench_output.txt
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: criterion-baseline-${{ matrix.version }}
          path: report/
          retention-days: 90
